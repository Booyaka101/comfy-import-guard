name: Feature request
description: Suggest something comfy-import-guard should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Reads your ComfyUI install and the custom-node repos in it. It does not start ComfyUI and does not run node code.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
